name: HUD and portable dashboard checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Test metrics and presentation
        shell: powershell
        run: .\Test.ps1
      - name: Build HUD
        shell: powershell
        run: .\Build.ps1 -OutputDirectory build\app
  portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Package portable release (tests run in matrix)
        shell: powershell
        run: .\Package.ps1 -SkipTests -SkipSmokeTest
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64-beta
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Check portable parsing, range analysis and local HTTP service
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Package dependency-free dashboard
        run: python PackageDashboard.py
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-${{ matrix.os }}
          path: dist/*-dashboard.zip
