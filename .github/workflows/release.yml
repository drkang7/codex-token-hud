name: Draft beta release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  draft:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - name: Check tag and package
        shell: powershell
        run: |
          $taskVersion = (Get-Content VERSION -Raw).Trim()
          if ($env:GITHUB_REF_NAME -ne "v$taskVersion") { throw 'Tag must match VERSION.' }
          .\Package.ps1
      - name: Create draft prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $taskAssets = @(Get-ChildItem dist -File | Where-Object { $_.Name -like '*.zip' -or $_.Name -like '*.sha256' } | ForEach-Object { $_.FullName })
          gh release create $env:GITHUB_REF_NAME @taskAssets --verify-tag --draft --prerelease --title "Codex Token HUD $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed.' }
